name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, zip, curl, mbstring, pdo_sqlite
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm --prefix gateway ci
      - run: npm --prefix gateway run typecheck
      # Linux runs the symlink-mode release tests and the signed-update tests that are skipped on Windows.
      - run: php plugin/tests/run.php
      - run: php agent/tests/run.php
      - run: npm --prefix gateway test
      - run: npm --prefix panel ci
      - run: npm --prefix panel exec -- tsc -p tsconfig.app.json --noEmit

  # Runs the real gateway against a real WordPress with the bridge installed: pairing, file writes and patches, wp-config,
  # an image upload, pages, scaffolds, the site map, core checksums, IndexNow. See gateway/test/wordpress.live.test.ts.
  # Everything it does happens in a throwaway WordPress on the runner.
  wordpress:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /tmp/wp
      WP_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, sodium, zip, curl, mbstring, gd, dom, xml
          tools: wp-cli
      - run: npm --prefix gateway ci
      - name: Install WordPress and the bridge
        run: |
          mkdir -p "$WP_DIR"
          wp --path="$WP_DIR" core download
          wp --path="$WP_DIR" config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp --path="$WP_DIR" core install --url="$WP_URL" --title=CI --admin_user=admin --admin_password=ci-password-123 --admin_email=ci@example.com --skip-email
          cp -r plugin/wp-mcp-bridge "$WP_DIR/wp-content/plugins/"
          wp --path="$WP_DIR" plugin activate wp-mcp-bridge
          echo "WPMCP_LIVE_WP_CODE=$(wp --path="$WP_DIR" eval 'echo WPMCP\Bridge\Connections::create_pairing( 1, "admin" );')" >> "$GITHUB_ENV"
      - name: Start WordPress
        # The bridge requests the site's own pages (inspect, IndexNow check), so the built-in server needs several workers.
        env:
          PHP_CLI_SERVER_WORKERS: 4
        run: |
          nohup php -S 127.0.0.1:8080 -t "$WP_DIR" > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do php -r 'exit(@file_get_contents(getenv("WP_URL") . "/") === false ? 1 : 0);' && break; sleep 1; done
          php -r 'exit(@file_get_contents(getenv("WP_URL") . "/") === false ? 1 : 0);'
      - name: Gateway against WordPress
        env:
          WPMCP_LIVE_WP_URL: ${{ env.WP_URL }}
        run: npm --prefix gateway test -- wordpress.live
      - name: Logs
        if: failure()
        run: |
          tail -n 80 /tmp/php-server.log || true
          tail -n 80 "$WP_DIR/wp-content/debug.log" || true
